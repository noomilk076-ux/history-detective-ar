<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  />

  <title>History Detective AR</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #07111f;
      color: white;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* --------------------------------------------------
       CAMERA
    -------------------------------------------------- */

    #camera {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);

      background: #000;
    }

    /* --------------------------------------------------
       LANDMARK CANVAS
    -------------------------------------------------- */

    #overlay {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    /* --------------------------------------------------
       TOP UI
    -------------------------------------------------- */

    #topBar {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      padding:
        env(safe-area-inset-top)
        18px
        14px
        18px;

      background:
        linear-gradient(
          rgba(0,0,0,.70),
          rgba(0,0,0,.10)
        );

      z-index: 10;
    }

    #title {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: .5px;
    }

    #status {
      margin-top: 5px;

      font-size: clamp(13px, 2.5vw, 18px);

      opacity: .9;
    }

    /* --------------------------------------------------
       CENTER POINTER
    -------------------------------------------------- */

    #pointer {
      position: absolute;

      width: 52px;
      height: 52px;

      border-radius: 50%;

      border: 4px solid white;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.95) 0 7px,
          rgba(255,255,255,.20) 8px 100%
        );

      box-shadow:
        0 0 18px rgba(255,255,255,.8);

      transform:
        translate(-50%, -50%);

      z-index: 20;

      pointer-events: none;

      display: none;
    }

    #pointer.locked {
      border-color: #ffd166;

      box-shadow:
        0 0 25px rgba(255,209,102,.95);
    }

    /* --------------------------------------------------
       TEST CONTROLS
    -------------------------------------------------- */

    #controls {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        18px
        18px
        calc(18px + env(safe-area-inset-bottom))
        18px;

      display: flex;

      justify-content: center;

      gap: 12px;

      z-index: 15;
    }

    .control {
      min-width: 150px;

      padding: 16px 22px;

      border-radius: 18px;

      border: 2px solid rgba(255,255,255,.35);

      background:
        rgba(10,20,35,.82);

      color: white;

      font-size: clamp(16px, 3vw, 22px);

      font-weight: 700;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(0,0,0,.35);

      transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
    }

    .control.hover {
      background: rgba(255,209,102,.25);

      border-color: #ffd166;

      transform: scale(1.06);
    }

    .control.selected {
      background: rgba(70,220,140,.40);

      border-color: #46dc8c;

      transform: scale(1.08);
    }

    /* --------------------------------------------------
       START SCREEN
    -------------------------------------------------- */

    #startScreen {
      position: absolute;

      inset: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at center,
          rgba(31,64,96,.92),
          rgba(3,10,18,.98)
        );
    }

    #startCard {
      width: min(720px, 100%);

      padding: 36px;

      border-radius: 28px;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(12px);

      text-align: center;
    }

    #startCard h1 {
      margin: 0 0 12px;

      font-size: clamp(30px, 7vw, 56px);
    }

    #startCard p {
      font-size: clamp(16px, 3vw, 22px);

      line-height: 1.6;

      opacity: .9;
    }

    #startButton {
      margin-top: 18px;

      padding: 17px 34px;

      border: 0;

      border-radius: 18px;

      background: #ffd166;

      color: #201500;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;
    }

    #startButton:active {
      transform: scale(.97);
    }

    /* --------------------------------------------------
       DEBUG PANEL
    -------------------------------------------------- */

    #debug {
      position: absolute;

      right: 12px;
      top: 90px;

      z-index: 30;

      padding: 10px 12px;

      border-radius: 12px;

      background: rgba(0,0,0,.65);

      font-size: 12px;

      line-height: 1.5;

      max-width: 260px;
    }

    /* --------------------------------------------------
       RESPONSIVE
    -------------------------------------------------- */

    @media (max-width: 700px) {

      #controls {
        flex-direction: column;

        align-items: center;
      }

      .control {
        width: min(420px, 90vw);
      }

      #debug {
        display: none;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- CAMERA -->
  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>

  <!-- LANDMARKS -->
  <canvas id="overlay"></canvas>

  <!-- POINTER -->
  <div id="pointer"></div>

  <!-- TOP UI -->
  <div id="topBar">

    <div id="title">
      🕵️ นักสืบประวัติศาสตร์
    </div>

    <div id="status">
      กำลังเตรียมระบบ...
    </div>

  </div>

  <!-- DEBUG -->
  <div id="debug">
    รอการตรวจจับ...
  </div>

  <!-- TEST BUTTONS -->
  <div id="controls">

    <div
      class="control"
      data-action="left"
    >
      ⬅️ เดินซ้าย
    </div>

    <div
      class="control"
      data-action="explore"
    >
      🔍 สำรวจ
    </div>

    <div
      class="control"
      data-action="right"
    >
      เดินขวา ➡️
    </div>

  </div>

  <!-- START -->
  <div id="startScreen">

    <div id="startCard">

      <h1>
        🏺 ภารกิจนักสืบ
      </h1>

      <p>
        ยืนหน้ากล้องประมาณ 1–2 เมตร
        <br>
        แล้วยกมือขึ้น
        <br>
        ใช้นิ้วชี้เพื่อควบคุมเคอร์เซอร์
      </p>

      <button id="startButton">
        🎥 เริ่มภารกิจ
      </button>

    </div>

  </div>

</div>


<script type="module">

/* ======================================================
   MEDIAPIPE
====================================================== */

import {
  HandLandmarker,
  PoseLandmarker,
  FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* ======================================================
   DOM
====================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("overlay");

const ctx =
  canvas.getContext("2d");

const pointer =
  document.getElementById("pointer");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const controls =
  [...document.querySelectorAll(".control")];


/* ======================================================
   MEDIAPIPE OBJECTS
====================================================== */

let handLandmarker = null;

let poseLandmarker = null;

let running = false;

let lastVideoTime = -1;


/* ======================================================
   CONSTANTS
====================================================== */

const HAND_MODEL =
"https://storage.googleapis.com/mediapipe-models/" +
"hand_landmarker/hand_landmarker/float16/1/" +
"hand_landmarker.task";

const POSE_MODEL =
"https://storage.googleapis.com/mediapipe-models/" +
"pose_landmarker/pose_landmarker_lite/float16/1/" +
"pose_landmarker_lite.task";


/* ======================================================
   POINTER STATE
====================================================== */

let pointerX = 0;

let pointerY = 0;

let smoothX = 0;

let smoothY = 0;


/* ======================================================
   HOVER / SELECT STATE
====================================================== */

let hoveredControl = null;

let hoverStartTime = 0;

let selectionLocked = false;


/* ======================================================
   SMOOTHING
====================================================== */

const SMOOTHING = 0.25;


/* ======================================================
   START
====================================================== */

startButton.addEventListener(
  "click",
  startExperience
);


/* ======================================================
   START EXPERIENCE
====================================================== */

async function startExperience() {

  try {

    startButton.disabled = true;

    status.textContent =
      "กำลังโหลดระบบตรวจจับร่างกาย...";

    const vision =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/" +
        "@mediapipe/tasks-vision@0.10.35/wasm"
      );


    /* --------------------------------------------------
       HAND
    -------------------------------------------------- */

    status.textContent =
      "กำลังเตรียมระบบตรวจจับนิ้ว...";

    handLandmarker =
      await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath: HAND_MODEL,
            delegate: "GPU"
          },

          runningMode: "VIDEO",

          numHands: 1,

          minHandDetectionConfidence: 0.55,

          minHandPresenceConfidence: 0.55,

          minTrackingConfidence: 0.55
        }
      );


    /* --------------------------------------------------
       POSE
    -------------------------------------------------- */

    status.textContent =
      "กำลังเตรียมระบบตรวจจับร่างกาย...";

    poseLandmarker =
      await PoseLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath: POSE_MODEL,
            delegate: "GPU"
          },

          runningMode: "VIDEO",

          numPoses: 1,

          minPoseDetectionConfidence: 0.5,

          minPosePresenceConfidence: 0.5,

          minTrackingConfidence: 0.5
        }
      );


    /* --------------------------------------------------
       CAMERA
    -------------------------------------------------- */

    status.textContent =
      "กำลังขอสิทธิ์ใช้กล้อง...";

    const stream =
      await navigator.mediaDevices.getUserMedia(
        {
          video: {
            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false
        }
      );


    video.srcObject = stream;

    await video.play();


    /* --------------------------------------------------
       HIDE START SCREEN
    -------------------------------------------------- */

    startScreen.style.display =
      "none";


    status.textContent =
      "พร้อมแล้ว! ยกมือขึ้นแล้วชี้นิ้ว";


    running = true;


    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    requestAnimationFrame(
      detectFrame
    );

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "เปิดกล้องหรือระบบตรวจจับไม่สำเร็จ";

    startButton.disabled = false;

    startButton.textContent =
      "ลองอีกครั้ง";

    alert(
      "ไม่สามารถเปิดกล้องได้\n\n" +
      "กรุณาอนุญาตการใช้กล้อง แล้วลองใหม่อีกครั้ง"
    );
  }
}


/* ======================================================
   RESIZE CANVAS
====================================================== */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;
}


/* ======================================================
   DETECTION LOOP
====================================================== */

async function detectFrame() {

  if (!running) return;


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {

    lastVideoTime =
      video.currentTime;


    const timestamp =
      performance.now();


    /* --------------------------------------------------
       HAND
    -------------------------------------------------- */

    let handResult = null;

    try {

      handResult =
        handLandmarker.detectForVideo(
          video,
          timestamp
        );

    }

    catch (error) {

      console.warn(
        "Hand detection error:",
        error
      );

    }


    /* --------------------------------------------------
       POSE
    -------------------------------------------------- */

    let poseResult = null;

    try {

      poseResult =
        poseLandmarker.detectForVideo(
          video,
          timestamp
        );

    }

    catch (error) {

      console.warn(
        "Pose detection error:",
        error
      );

    }


    /* --------------------------------------------------
       PROCESS
    -------------------------------------------------- */

    processHand(
      handResult
    );

    processPose(
      poseResult
    );


    /* --------------------------------------------------
       DRAW
    -------------------------------------------------- */

    drawDebug(
      handResult,
      poseResult
    );
  }


  requestAnimationFrame(
    detectFrame
  );
}


/* ======================================================
   HAND PROCESSING
====================================================== */

function processHand(result) {

  if (
    !result ||
    !result.landmarks ||
    result.landmarks.length === 0
  ) {

    pointer.style.display =
      "none";

    hoveredControl =
      null;

    return;
  }


  const hand =
    result.landmarks[0];


  /*
   * MediaPipe hand landmark #8
   * = index fingertip
   */

  const indexFinger =
    hand[8];


  /*
   * Because the camera is mirrored,
   * invert X.
   */

  const targetX =
    (1 - indexFinger.x)
    * window.innerWidth;

  const targetY =
    indexFinger.y
    * window.innerHeight;


  /*
   * Smooth the cursor
   */

  smoothX +=
    (targetX - smoothX)
    * SMOOTHING;

  smoothY +=
    (targetY - smoothY)
    * SMOOTHING;


  pointerX =
    smoothX;

  pointerY =
    smoothY;


  pointer.style.display =
    "block";


  pointer.style.left =
    `${pointerX}px`;

  pointer.style.top =
    `${pointerY}px`;


  checkControls();
}


/* ======================================================
   BODY PROCESSING
====================================================== */

function processPose(result) {

  if (
    !result ||
    !result.landmarks ||
    result.landmarks.length === 0
  ) {

    return;
  }


  const pose =
    result.landmarks[0];


  /*
   * MediaPipe Pose:
   *
   * 11 = left shoulder
   * 12 = right shoulder
   * 23 = left hip
   * 24 = right hip
   */

  const leftShoulder =
    pose[11];

  const rightShoulder =
    pose[12];

  const leftHip =
    pose[23];

  const rightHip =
    pose[24];


  if (
    !leftShoulder ||
    !rightShoulder ||
    !leftHip ||
    !rightHip
  ) {

    return;
  }


  /*
   * Body center
   */

  const centerX =
    (
      leftShoulder.x +
      rightShoulder.x +
      leftHip.x +
      rightHip.x
    ) / 4;


  /*
   * Because camera is mirrored
   */

  const mirroredX =
    1 - centerX;


  /*
   * Convert to screen
   */

  const bodyScreenX =
    mirroredX *
    window.innerWidth;


  /*
   * Navigation zones
   */

  if (
    bodyScreenX <
    window.innerWidth * 0.30
  ) {

    status.textContent =
      "⬅️ เดินไปทางซ้าย";

  }

  else if (
    bodyScreenX >
    window.innerWidth * 0.70
  ) {

    status.textContent =
      "เดินไปทางขวา ➡️";

  }

  else {

    status.textContent =
      "พร้อมแล้ว — ชี้ไปที่เบาะแส";
  }


  /*
   * Shoulder angle
   * can later become
   * left/right turning.
   */

  const dx =
    rightShoulder.x -
    leftShoulder.x;

  const dy =
    rightShoulder.y -
    leftShoulder.y;

  const angle =
    Math.atan2(
      dy,
      dx
    )
    * 180 / Math.PI;


  /*
   * Debug
   */

  debug.innerHTML =
    `
      <b>ระบบตรวจจับ</b><br>
      ร่างกาย: ✓<br>
      ตำแหน่ง X:
      ${Math.round(bodyScreenX)}<br>
      ไหล่:
      ${angle.toFixed(1)}°
    `;
}


/* ======================================================
   CONTROL DETECTION
====================================================== */

function checkControls() {

  let found = null;


  for (
    const control of controls
  ) {

    const rect =
      control.getBoundingClientRect();


    if (
      pointerX >= rect.left &&
      pointerX <= rect.right &&
      pointerY >= rect.top &&
      pointerY <= rect.bottom
    ) {

      found =
        control;

      break;
    }
  }


  /*
   * No control
   */

  if (!found) {

    controls.forEach(
      c =>
        c.classList.remove(
          "hover"
        )
    );

    hoveredControl =
      null;

    hoverStartTime =
      0;

    pointer.classList.remove(
      "locked"
    );

    selectionLocked =
      false;

    return;
  }


  /*
   * New control
   */

  if (
    found !==
    hoveredControl
  ) {

    controls.forEach(
      c =>
        c.classList.remove(
          "hover"
        )
    );

    found.classList.add(
      "hover"
    );

    hoveredControl =
      found;

    hoverStartTime =
      performance.now();

    selectionLocked =
      false;

    pointer.classList.remove(
      "locked"
    );

    return;
  }


  /*
   * Hold for 1 second
   */

  const elapsed =
    performance.now()
    -
    hoverStartTime;


  if (
    elapsed >= 1000 &&
    !selectionLocked
  ) {

    selectionLocked =
      true;

    pointer.classList.add(
      "locked"
    );

    found.classList.add(
      "selected"
    );


    selectControl(
      found.dataset.action
    );


    setTimeout(
      () => {

        found.classList.remove(
          "selected"
        );

        pointer.classList.remove(
          "locked"
        );

        selectionLocked =
          false;

      },
      900
    );
  }
}


/* ======================================================
   CONTROL ACTION
====================================================== */

function selectControl(action) {

  if (
    action ===
    "left"
  ) {

    status.textContent =
      "⬅️ สั่งให้ตัวละครเดินซ้าย";

  }


  if (
    action ===
    "right"
  ) {

    status.textContent =
      "สั่งให้ตัวละครเดินขวา ➡️";

  }


  if (
    action ===
    "explore"
  ) {

    status.textContent =
      "🔍 สำรวจ!";

  }


  console.log(
    "ACTION:",
    action
  );
}


/* ======================================================
   DEBUG DRAW
====================================================== */

function drawDebug(
  handResult,
  poseResult
) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   * We only draw the index fingertip
   * in this first prototype.
   */

  if (
    handResult &&
    handResult.landmarks &&
    handResult.landmarks.length
  ) {

    const hand =
      handResult.landmarks[0];

    const finger =
      hand[8];


    const x =
      (1 - finger.x)
      * canvas.width;

    const y =
      finger.y
      * canvas.height;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      12,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,209,102,.95)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      24,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "rgba(255,209,102,.6)";

    ctx.lineWidth =
      3;

    ctx.stroke();
  }
}


/* ======================================================
   PAGE VISIBILITY
====================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      running =
        false;

    }

    else if (
      video.srcObject
    ) {

      running =
        true;

      requestAnimationFrame(
        detectFrame
      );
    }
  }
);

</script>

</body>
</html>
